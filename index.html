const $=x=>document.getElementById(x), fmt=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0}), money=n=>'₺'+fmt.format(Math.round((+n||0)*100)/100), precise=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}), fmoney=n=>'₺'+precise.format(Math.round((+n||0)*100)/100), shortMoney=n=>{n=+n||0;return n>=1e6?'₺'+precise.format(n/1e6)+' Mn':n>=1e4?'₺'+fmt.format(n):money(n)}, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), round=n=>Math.round((n+Number.EPSILON)*100)/100, clamp=(n,min,max)=>Math.min(max,Math.max(min,n)), uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'g'+Date.now().toString(36)+Math.random().toString(36).slice(2), sum=(arr,fn)=>arr.reduce((a,x)=>a+fn(x),0), dayms=86400000, localToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}, dayDate=s=>new Date(s+'T12:00:00'), isoDay=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), dayOffset=n=>{const d=dayDate(localToday());d.setDate(d.getDate()+n);return isoDay(d)}, fmtDate=(s,opt={day:'numeric',month:'short',year:'numeric'})=>{const d=dayDate(s);return Number.isNaN(d.valueOf())?'—':d.toLocaleDateString('tr-TR',opt)}, daysLeft=s=>Math.ceil((dayDate(s)-dayDate(localToday()))/dayms), num=v=>Number.isFinite(Number(v))?Number(v):0, validNum=v=>Number.isFinite(v)&&v>=0&&v<=1e12;
const icons={eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M3 3 21 21M10.6 5.1A11.6 11.6 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3.4 4.3M6.4 6.4C3.6 8.2 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"/><path d="M10 10a3 3 0 0 0 4 4"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',chev:'<path d="m9 18 6-6-6-6"/>',spark:'<path d="m12 3 1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9zM19 18l.7 1.3L21 20l-1.3.7L19 22l-.7-1.3L17 20l1.3-.7z"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-7z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',down:'<path d="m6 9 6 6 6-6"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>',wallet:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M16 14h2"/>',flip:'<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/>',upload:'<path d="M12 17V5m-5 5 5-5 5 5M4 17v3h16v-3"/>',trash:'<path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',edit:'<path d="m4 16-.5 4.5L8 20l12-12-4-4z"/>',heart:'<path d="M20.8 8.5c0 4.5-8.8 10.5-8.8 10.5S3.2 13 3.2 8.5a4.8 4.8 0 0 1 8.8-2.4 4.8 4.8 0 0 1 8.8 2.4z"/>',gift:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M7.5 9C2 9 4 3 7 4c3 1 5 5 5 5s2-4 5-5c3-1 5 5-.5 5"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',shield:'<path d="m12 2 8 3v6c0 5-3 8.5-8 11-5-2.5-8-6-8-11V5z"/><path d="m8 12 3 3 5-6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',up:'<path d="M12 19V5m-5 5 5-5 5 5"/>'};
function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.spark}</svg>`}
let state={version:2,demo:false,goals:[],transactions:[],settings:{privacy:false}}, ui={tab:'home',goalFilter:'all',txFilter:'all',studioGoal:null,simMonthly:null,simBonus:0}, toastTimer=null;
const sanitize=(raw)=>{if(!raw||!Array.isArray(raw.goals)||!Array.isArray(raw.transactions))throw Error('Beklenmeyen veri biçimi');if(raw.goals.length>2000||raw.transactions.length>50000)throw Error('Çok büyük yedek');const goals=raw.goals.map(g=>{if(typeof g.id!=='string'||typeof g.name!=='string'||typeof g.date!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(g.date)||!Number.isFinite(dayDate(g.date).valueOf())||!validNum(g.target)||g.target<=0||!validNum(g.saved))throw Error('Geçersiz hedef');return {id:g.id.slice(0,100),name:g.name.slice(0,70),target:round(g.target),saved:round(g.saved),date:g.date,monthlyPlan:validNum(g.monthlyPlan)?round(g.monthlyPlan):0,icon:ICONS.includes(g.icon)?g.icon:'🎯',color:COLORS.includes(g.color)?g.color:COLORS[0],letter:typeof g.letter==='string'?g.letter.slice(0,360):'',createdAt:typeof g.createdAt==='string'&&!Number.isNaN(new Date(g.createdAt).valueOf())?g.createdAt:new Date().toISOString()}});if(new Set(goals.map(g=>g.id)).size!==goals.length)throw Error('Tekrarlanan hedefler');const transactions=raw.transactions.map(t=>{if(typeof t.id!=='string'||typeof t.goalId!=='string'||!validNum(t.amount)||t.amount<=0||!['in','out'].includes(t.type)||typeof t.date!=='string'||Number.isNaN(new Date(t.date).valueOf()))throw Error('Geçersiz işlem');return {id:t.id.slice(0,100),goalId:t.goalId.slice(0,100),amount:round(t.amount),type:t.type,kind:['save','withdraw','skip','opening','transfer'].includes(t.kind)?t.kind:(t.type==='in'?'save':'withdraw'),note:typeof t.note==='string'?t.note.slice(0,140):'',date:t.date,transferId:typeof t.transferId==='string'?t.transferId.slice(0,100):null}});if(new Set(transactions.map(t=>t.id)).size!==transactions.length)throw Error('Tekrarlanan işlemler');return {version:2,demo:!!raw.demo,goals,transactions,settings:{privacy:!!raw.settings?.privacy}}};
let stored=false;try{const v2=localStorage.getItem(KEY),v1=localStorage.getItem(OLD);if(v2){state=sanitize(JSON.parse(v2));stored=true}else if(v1){state=sanitize(JSON.parse(v1));localStorage.setItem(KEY,JSON.stringify(state));stored=true}}catch(err){console.warn('GoalWise depolama:',err)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(err){toast('Kayıt yapılamadı. Depolama iznini kontrol et.');return false}}
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3400)}

function requiredMonthly(g){const days=daysLeft(g.date),remaining=Math.max(0,g.target-g.saved);if(!remaining)return 0;if(days<=0)return Infinity;return Math.ceil(remaining/(days/30.4375))}
function projectedDate(g,monthly=g.monthlyPlan,bonus=0){const remain=Math.max(0,g.target-g.saved-Math.max(0,bonus));if(remain<=0)return localToday();if(!monthly||monthly<=0)return null;const dayCount=Math.ceil(remain/monthly*30.4375);if(dayCount>365000)return null;return dayOffset(dayCount)}
function goalStatus(g){const remaining=Math.max(0,g.target-g.saved),days=daysLeft(g.date),req=requiredMonthly(g);if(remaining===0)return {text:'Tamamlandı',kind:'good'};if(days<0)return {text:'Tarih geçti',kind:'warn'};if(days<14&&g.monthlyPlan<req)return {text:'Son düzlüktesin',kind:'warn'};if(g.monthlyPlan<=0)return {text:'Ritim belirle',kind:''};if(g.monthlyPlan>=req)return {text:'Planın yolunda',kind:'ok'};return {text:'Hızlanabilirsin',kind:'warn'}}

function homeHTML(){const t=totals(),p=t.target?Math.round(sum(state.goals,g=>Math.min(g.saved,g.target))/t.target*100):0,focus=mostUrgent(),txs=state.transactions.filter(x=>x.kind!=='transfer'&&x.kind!=='opening'),weekTotal=round(sum(txs.filter(x=>Date.now()-new Date(x.date).valueOf()<=7*dayms&&Date.now()-new Date(x.date).valueOf()>=0),x=>x.type==='in'?x.amount:-x.amount));const headDate=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});let insight;if(!t.count)insight=['Geleceğin için bir adım','Büyük hedefler küçük bir başlangıçla ilerler. İlk birikim hedefini oluşturarak başla.'];else if(focus){const required=requiredMonthly(focus);insight=[`${focus.icon} ${focus.name}`,!Number.isFinite(required)?'Hedef tarihin geçti. Tarihi veya planını güncelleyebilirsin.':`${readableDays(daysLeft(focus.date))}. Zamanında ulaşmak için ayda yaklaşık ${money(required)} ayırman gerekiyor.`]}else insight=['Her hedefe ulaştın!','Harika bir yolculuk. Yeni bir hayal için yepyeni bir sayfa açabilirsin.'];return `<section class="page-intro"><div class="eyebrow">${esc(headDate)}</div><h1>Hayallerin var.<br><em>Bir de planın.</em></h1><p>Gelecekteki kendine bugün bir iyilik yap.</p></section>${state.demo?`<div class="demo-strip"><span>✦ Örnek verilerle keşif modundasın</span><button data-action="clearDemo">Temizle</button></div>`:''}<section class="hero"><div class="hero-top">${icon('wallet',15)} Toplam birikim kasan</div><div class="hero-total">${priv(money(t.saved))}</div><div class="hero-description">Hedeflerine giden yolda biriktirdiğin toplam tutar</div><div class="hero-line"></div><div class="hero-metrics"><div><div class="metric-label">Toplam hedef</div><strong>${priv(shortMoney(t.target))}</strong></div><div><div class="metric-label">Hedef sayısı</div><strong>${t.count}</strong></div><div><div class="metric-label">Genel ilerleme</div><strong class="accent">%${p}</strong></div></div></section><div class="quick-grid"><button class="quick-action prima function heatmapHTML(){const values=[];let active=0;for(let i=27;i>=0;i--){const date=dayOffset(-i);const amount=round(sum(state.transactions.filter(t=>t.date.slice(0,10)===date&&t.kind!=='opening'&&t.kind!=='transfer'),t=>t.type==='in'?t.amount:-t.amount));if(amount>0)active++;values.push({date,amount})}const max=Math.max(1,...values.map(x=>x.amount));return `<div class="heatmap-wrap"><div class="heatmap-top"><div><h3>Az ama istikrarlı.</h3><p>Her yeşil kare, birikime ayırdığın bir gün.</p></div><span class="state-pill ok">${active} aktif gün</span></div><div class="heatmap" aria-label="Son 28 günde birikim yapılan günler">${values.map(x=>`<i class="level-${x.amount>0?Math.max(1,Math.ceil(x.amount/max*3)):0}" title="${fmtDate(x.date)}: ${money(x.amount)}"></i>`).join('')}</div><div class="legend"><span>28 gün önce</span><span>Bugün</span></div></div>`}
function goalsHTML(){const filtered=state.goals.filter(g=>ui.goalFilter==='all'||(ui.goalFilter==='active'?g.saved<g.target:g.saved>=g.target));return `<div class="page-title-row"><div><div class="eyebrow">HAYAL KOLEKSİYONUN</div><h1>Hedef kasan.</h1><p>Her hedefin kendine ait bir hikâyesi var.</p></div><button class="icon-btn" data-action="newGoal" title="Hedef ekle" aria-label="Hedef ekle" style="color:var(--lime)">${icon('plus',21)}</button></div><div class="sub-tabs"><button data-action="goalFilter" data-filter="all" class="${ui.goalFilter==='all'?'selected':''}">Tümü (${state.goals.length})</button><button data-action="goalFilter" data-filter="active" class="${ui.goalFilter==='active'?'selected':''}">Devam eden</button><button data-action="goalFilter" data-filter="done" class="${ui.goalFilter==='done'?'selected':''}">Tamamlanan</button></div>${filtered.length?filtered.map(goalCard).join(''):`<section class="empty"><div class="empty-visual">${icon('spark',32)}</div><h3>${state.goals.length?'Burada hedef bulunmuyor':'Geleceğini tasarla'}</h3><p>${state.goals.length?'Başka filtre seçebilir veya yeni hedef oluşturabilirsin.':'İlk hedefini oluşturup hedef tarihini, tutarını ve aylık planını belirle.'}</p><button class="btn" data-action="newGoal">${icon('plus',17)} Hedef oluştur</button>${!state.goals.length?`<div style="margin-top:11px"><button class="text-button muted" data-action="demo">Örnekleri incele ${icon('arrow',13)}</button></div>`:''}</section>`}${state.goals.length>1?`<button class="btn secondary full" style="margin-top:10px" data-action="transfer">${icon('flip',16)} Hedefler arası aktarım</button>`:''}`}
function labHTML(){const goals=state.goals.filter(g=>g.saved<g.target);if(!goals.length)return `<section class="lab-head"><div class="lab-label">${icon('spark',15)} ZAMAN MAKİNESİ</div><h2>Geleceği bugünden gör.</h2><p>Bir hedef oluşturduğunda farklı birikim senaryolarını test edebileceksin.</p></section><div class="empty" style="margin-top:17px"><div class="empty-visual">${icon('clock',30)}</div><h3>Senaryo bekliyor</h3><p>Aktif bir hedefe ihtiyacımız var.</p><button class="btn" data-action="newGoal">Hedef oluştur</button></div>`;if(!goals.some(x=>x.id===ui.studioGoal))ui.studioGoal=goals[0].id;const g=goals.find(x=>x.id===ui.studioGoal),req=requiredMonthly(g),initial=ui.simMonthly===null?g.monthlyPlan||Math.ceil((Number.isFinite(req)?req:1000)/100)*100:ui.simMonthly,max=Math.max(5000,Math.ceil(Math.max(initial,Number.isFinite(req)?req:1000,g.monthlyPlan)*2/1000)*1000),step=Math.max(50,Math.ceil(max/180/50)*50),monthly=clamp(initial,0,max),bonus=Math.max(0,ui.simBonus);ui.simMonthly=monthly;const todayEta=projectedDate(g,monthly,bonus),baseline=projectedDate(g,g.monthlyPlan,0),gain=todayEta&&baseline?daysLeft(baseline)-daysLeft(todayEta):null;return `<div class="lab-head"><div class="lab-label">${icon('spark',16)} GOALWISE ÖZEL</div><h2>Zaman makinesi.</h2><p>"Şu kadar biriktirsem ne olur?" sorusunun cevabını şimdi gör.</p></div><section class="lab-body"><label class="form-label" for="labGoal">Hangi hayalin için hesaplıyoruz?</label><select class="select" id="labGoal">${goals.map(x=>`<option value="${esc(x.id)}" ${x.id===g.id?'selected':''}>${esc(x.icon+' '+x.name)}</option>`).join('')}</select><div class="input-group"><div class="lab-slider-top"><div><label class="form-label" for="monthlyRange" style="margin:0">Aylık birikim planın</label><div class="small-note">Kaydır, geleceğin nasıl değişiyor gör.</div></div><strong class="amount-live" id="monthlyLive">${money(monthly)}</strong></div><input type="range" id="monthlyRange" min="0" max="${max}" step="${step}" value="${monthly}" style="--fill:${monthly/max*100}%"><div class="lab-range-labels"><span>₺0</span><span>${money(max)}</span></div></div><div class="input-group"><label class="form-label" for="bonusInput">Bir defalık ekstra birikim (isteğe bağlı)</label><input class="field" id="bonusInput" type="number" inputmode="decimal" min="0" max="1000000000000" step="0.01" value="${bonus||''}" placeholder="Örn. 5000"><div class="small-note">Sadece simülasyon; gerçek birikimine eklenmez.</div></div><div class="scenario-result" id="scenarioResult">${scenarioHTML(g,monthly,bonus)}</div><div class="compare"><div><span>Bugünkü planınla</span><strong id="baselineDate">${baseline?fmtDate(baseline):'Henüz plan yok'}</strong></div><div><span>Yeni senaryoda fark</span><strong id="scenarioGain" class="${gain!==null&&gain>0?'good':''}">${gain===null?'Karşılaştırılamıyor':gain>0?`${gain} gün erken`:gain<0?`${Math.abs(gain)} gün geç`:'Aynı tarih'}</strong></div></div><div class="lab-footer"><button class="btn full" data-action="savePlan">${icon('check',18)} Aylık planımı bu yap</button><p class="fineprint" style="text-align:center">Kaydedilen plan otomatik para eklemez; yalnızca tahmin ve nabız hesaplarını değiştirir.</p></div></section><div class="section-heading"><h2>Gerçekçi hedef temposu</h2></div><div class="journey-card"><div class="journey-top"><div class="journey-badge">${icon('clock',22)}</div><div><b>${esc(g.name)}</b><p>Belirlediğin hedef tarihine yetişmek için:</p></div></div><div style="font-weight:850;letter-spacing:-1px;font-size:25px;margin-top:14px;color:var(--cyan)">${Number.isFinite(req)?priv(money(req))+' <span style="font-size:12px;color:var(--muted)">/ ay</span>':'Hedef tarihi geçti'}</div><p class="small-note">Kalan tutar: ${priv(money(Math.max(0,g.target-g.saved)))} · Hedef: ${fmtDate(g.date)}</p></div>`}
function scenarioHTML(g,monthly,bonus){const projected=projectedDate(g,monthly,bonus),remain=Math.max(0,g.target-g.saved-bonus),days=projected?daysLeft(projected):null;const message=remain<=0?'Ek birikimle hedefe bugün ulaşmış olursun.':!monthly?'Aylık tutarı artırırsan hedef tarihini hesaplayabiliriz.':`Bugünden itibaren yaklaşık ${Math.max(0,days)} gün sonra hedefe ulaşabilirsin.`;return `<div class="sr-eyebrow">TAHMİNİ HEDEFE ULAŞMA TARİHİN</div><div class="sr-date">${projected?fmtDate(projected,{day:'numeric',month:'long',year:'numeric'}):'Plan belirle'}</div><p>${esc(message)}</p>`}
function updateScenario(){const g=state.goals.find(x=>x.id===ui.studioGoal);if(!g)return;const r=$('monthlyRange');if(!r)return;const monthly=+r.value,bonus=clamp(+($('bonusInput')?.value||0),0,1e12),projected=projectedDate(g,monthly,bonus),baseline=projectedDate(g,g.monthlyPlan),gain=projected&&baseline?daysLeft(baseline)-daysLeft(projected):null;ui.simMonthly=monthly;ui.simBonus=bonus;r.style.setProperty('--fill',(monthly/+r.max*100)+'%');$('monthlyLive').textContent=money(monthly);$('scenarioResult').innerHTML=scenarioHTML(g,monthly,bonus);$('scenarioGain').textContent=gain===null?'Karşılaştırılamıyor':gain>0?`${gain} gün erken`:gain<0?`${Math.abs(gain)} gün geç`:'Aynı tarih';$('scenarioGain').className=gain!==null&&gain>0?'good':''}
function activityHTML(){const list=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).filter(x=>ui.txFilter==='all'||(ui.txFilter==='in'?x.type==='in':x.type==='out'));const groups=new Map();for(const t of list){const date=t.date.slice(0,10),arr=groups.get(date)||[];arr.push(t);groups.set(date,arr)}let body='';for(const [date,arr] of groups){body+=`<section class="activity-group"><div class="activity-date">${date===localToday()?'BUGÜN':date===dayOffset(-1)?'DÜN':fmtDate(date,{day:'numeric',month:'long',year:'numeric'}).toUpperCase()}</div>${arr.map(t=>{const g=state.goals.find(g=>g.id===t.goalId),label=t.kind==='skip'?'Harcama dönüştürüldü':t.kind==='transfer'?'Hedefler arası aktarım':t.kind==='opening'?'İlk birikim':t.type==='out'?'Para çekildi':'Birikim eklendi';return `<div class="activity-item"><div class="activity-icon ${t.type==='out'?'out':t.kind==='skip'?'swap':''}">${icon(t.kind==='skip'?'spark':t.kind==='transfer'?'flip':t.type==='out'?'down':'up',19)}</div><div class="activity-text"><b>${esc(g?.name||'Silinmiş hedef')} · ${esc(label)}</b><p>${esc(t.note||'Not eklenmedi')} · ${new Date(t.date).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</p></div><div class="activity-right"><b class="${t.type==='in'?'in':'out'}">${t.type==='in'?'+':'−'}${priv(money(t.amount))}</b><button data-action="undoTx" data-id="${esc(t.id)}">Geri al</button></div></div>`}).join('')}</section>`}return `<div class="page-title-row"><div><div class="eyebrow">BİRİKİM GÜNLÜĞÜN</div><h1>Her adım değerli.</h1><p>Küçük kararlar, büyük farklar.</p></div><div style="color:var(--lime)">${icon('clock',29)}</div></div><div class="filter-row"><button data-action="txFilter" data-filter="all" class="${ui.txFilter==='all'?'active':''}">Tümü</button><button data-action="txFilter" data-filter="in" class="${ui.txFilter==='in'?'active':''}">Gelenler</button><button data-action="txFilter" data-filter="out" class="${ui.txFilter==='out'?'active':''}">Çıkanlar</button></div>${list.length?body:`<section class="empty" style="margin-top:17px"><div class="empty-visual">${icon('clock',32)}</div><h3>Henüz işlem yok</h3><p>İlk para ekleme işlemini kaydettiğinde burada görünecek.</p><button class="btn" data-action="quickDeposit">${icon('plus',16)} Para ekle</button></section>`}`}
function render(scroll=false){$('screen').innerHTML=ui.tab==='home'?homeHTML():ui.tab==='goals'?goalsHTML():ui.tab==='lab'?labHTML():activityHTML();document.querySelectorAll('.nav [data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===ui.tab);b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false')});$('privacyBtn').innerHTML=icon(state.settings.privacy?'eyeoff':'eye',19);$('privacyBtn').setAttribute('aria-label',state.settings.privacy?'Tutarları göster':'Tutarları gizle');$('app').classList.toggle('privacy',state.settings.privacy);document.body.classList.toggle('privacy',state.settings.privacy);if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function modal(title,subtitle,html){const root=$('modalRoot');root.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-grip"></div><div class="sheet-head"><div><h2 id="sheetTitle">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="icon-btn" data-action="close" aria-label="Kapat">${icon('close',17)}</button></div><div class="sheet-content">${html}</div></section>`;root.classList.add('active');root.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';setTimeout(()=>root.querySelector('input:not([type="radio"]),select,button')?.focus({preventScroll:true}),70)}
function close(){const root=$('modalRoot');root.classList.remove('active');root.setAttribute('aria-hidden','true');document.body.style.overflow='';setTimeout(()=>{if(!root.classList.contains('active'))root.innerHTML=''},220)}
function field(label,id,placeholder='',value='',type='text',extra=''){return `<div class="input-group"><label class="form-label" for="${id}">${label}</label><input class="field" id="${id}" name="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${extra}></div>`}

sil</button>`:''}`);$('goalForm').dataset.id=id||''}
function openTransaction(type='in',id=null){if(!state.goals.length){openGoalForm();return}const g=state.goals.find(x=>x.id===id)||state.goals[0];modal(type==='in'?'Hayaline para ekle':'Birikiminden para çek',type==='in'?'Bugünkü küçük adımın, gelecekte büyük bir fark.':'İşlemini kaydettiğinde mevcut tutarın güncellenecek.',`<form id="transactionForm"><div class="input-group"><label class="form-label" for="txGoal">Hedef</label>${selectGoals('txGoal',g.id)}</div>${field('Tutar (₺)','txAmount','Örn. 1000','','number','required min="0.01" max="1000000000000" step="0.01"')}${field('İşlem notu (isteğe bağlı)','txNote','Örn. Bu ayki birikim','','text','maxlength="140"')}<div class="info-banner">${icon('shield',16)} Gerçek banka transferi yapılmaz. Bu ekran, biriktirdiğin paranın kaydını tutar.</div><div class="sheet-actions"><button class="btn secondary" type="button" data-action="close">Vazgeç</button><button class="btn" type="submit">${type==='in'?'Biriktirdim, kaydet':'Çekimi kaydet'}</button></div></form>`);$('transactionForm').dataset.type=type}
function openSwap(){if(!state.goals.length){openGoalForm();toast('Önce bir hedef oluştur');return}modal('Harcamanı dönüştür','Almadığın bir şeyi hayaline dönüştür. Bu küçük kararlar birikim ritmi oluşturur.',`<form id="swapForm">${field('Vazgeçtiğin harcama','swapName','Örn. Dışarıdan kahve','','text','maxlength="80" required')}${field('Kenara ayırdığın tutar (₺)','swapAmount','Örn. 150','','number','required min="0.01" max="1000000000000" step="0.01"')}<div class="chip-row">${[75,150,300,500].map(n=>`<button type="button" class="chip" data-action="amountChip" data-value="${n}">${money(n)}</button>`).join('')}</div><div class="input-group"><label class="form-label" for="swapGoal">Hangi hedefe katkı olsun?</label>${selectGoals('swapGoal')}</div><div class="info-banner"><b>Hayal takası ✨</b><div id="swapImpact" style="margin-top:5px">Tutarı girince hedefine katkısını göstereceğiz.</div><p class="fineprint" style="margin-top:8px">Yalnızca gerçekten kenara ayırdığın tutarı kaydet. Sadece bir harcamadan vazgeçmek, tek başına parayı biriktirmez.</p></div><div class="sheet-actions"><button type="button" class="btn secondary" data-action="close">Vazgeç</button><button class="btn" type="submit">${icon('spark',16)} Birikime dönüştür</button></div></form>`);updateSwapImpact()}
function updateSwapImpact(){const el=$('swapImpact');if(!el)return;const amount=clamp(num($('swapAmount')?.value),0,1e12),g=state.goals.find(x=>x.id===$('swapGoal')?.value);if(!g||!amount){el.textContent='Tutarı girince hedefine katkısını göstereceğiz.';return}const now=projectedDate(g,g.monthlyPlan),after=projectedDate(g,g.monthlyPlan,amount),days=now&&after?daysLeft(now)-daysLeft(after):null,percent=amount/g.target*100;el.textContent=days!==null&&days>0?`Bu hamleyle hedefine yaklaşık ${days} gün daha erken ulaşabilirsin.`:`Bu hamle hedefinin %${precise.format(percent)}’lik kısmına katkı sağlayabilir.`}
function openTransfer(){if(state.goals.length<2){toast('Aktarım için en az iki hedef gerekli');return}modal('Hedefler arası aktar','Toplam birikimin değişmez, sadece hedefler arasındaki dağılım güncellenir.',`<form id="transferForm"><div class="input-group"><label class="form-label" for="transferFrom">Hangi hedeften?</label>${selectGoals('transferFrom',state.goals[0]?.id)}</div><div class="input-group"><label class="form-label" for="transferTo">Hangi hedefe?</label>${selectGoals('transferTo',state.goals[1]?.id)}</div>${field('Aktarılacak tutar (₺)','transferAmount','Örn. 2000','','number','required min="0.01" max="1000000000000" step="0.01"')}<div class="sheet-actions"><button class="btn secondary" type="button" data-action="close">Vazgeç</button><button class="btn" type="submit">${icon('flip',17)} Aktarımı kaydet</button></div></form>`)}
function openDetail(id){const g=state.goals.find(x=>x.id===id);if(!g)return;const p=clamp(g.saved/g.target*100,0,100),r=requiredMonthly(g),proj=projectedDate(g),status=goalStatus(g), milestones=[25,50,75,100];modal('Hedef pasaportu','Hayalinle arandaki mesafeyi burada gör.',`<div class="detail-header" style="--tone:${g.color}"><div class="goal-icon">${g.icon}</div><div><h3>${esc(g.name)}</h3><p>${fmtDate(g.date)} · <span class="state-pill ${status.kind}" style="padding:3px 7px">${esc(status.text)}</span></p></div></div><div class="goal-money"><strong>${priv(money(g.saved))}</strong><span>${priv(money(g.target))}</span></div><div class="bar" style="--tone:${g.color};height:10px"><div class="bar-fill" style="width:${p}%"></div></div><div class="goal-bottom"><span style="font-size:11px;color:var(--muted)">%${Math.floor(p)} tamamlandı</span><span style="font-size:11px;color:var(--muted)">${priv(money(Math.max(0,g.target-g.saved)))} kaldı</span></div><div class="detail-stats"><div class="detail-stat"><small>Hedefe yetişmek için / ay</small><strong>${Number.isFinite(r)?priv(money(r)):'Tarih geçti'}</strong></div><div class="detail-stat"><small>Mevcut planla tahmin</small><strong>${proj?fmtDate(proj):'Plan yok'}</strong></div></div><div class="section-heading" style="margin:21px 0 6px"><h2>Yolculuk durakların</h2></div><div class="milestone-list">${milestones.map(m=>`<div class="milestone ${p>=m?'passed':''}"><div class="dot">${p>=m?icon('check',15):m/25}</div><small>%${m}</small></div>`).join('')}</div>${g.letter?`<div class="secret-letter"><b>${icon(g.saved>=g.target?'gift':'lock',15)} ${g.saved>=g.target?'Gelecekteki kendine mesajın':'Zaman kapsülün kilitli'}</b><p>${g.saved>=g.target?esc(g.letter):'Bu hedefe ulaştığında geçmişteki kendinden bir mesajın olacak. ✉️'}</p></div>`:''}<div class="sheet-actions"><button class="btn" data-action="deposit" data-id="${esc(g.id)}">${icon('plus',16)} Para ekle</button><button class="btn secondary" data-action="withdraw" data-id="${esc(g.id)}">${icon('down',16)} Para çek</button></div><div class="sheet-actions" style="margin-top:9px"><button class="btn ghost" data-action="editGoal" data-id="${esc(g.id)}">${icon('edit',16)} Düzenle</button><button class="btn ghost" data-action="labFor" data-id="${esc(g.id)}">${icon('spark',16)} Senaryo dene</button></div>`)}
function openSettings(){modal('Ayarlar & güvenlik','Verilerin hesabında değil, yalnızca bu cihazın tarayıcısında tutulur.',`<div class="settings-row"><div><strong>Gizli görünüm</strong><p>Tutarları ekranda bulanıklaştır.</p></div><button class="btn secondary sm" data-action="privacy">${state.settings.privacy?'Göster':'Gizle'}</button></div><div class="settings-row"><div><strong>Yedeğini dışa aktar</strong><p>Hedefler ve işlemler JSON dosyasına kaydedilir.</p></div><button class="btn secondary sm" data-action="export">${icon('download',14)} Yedekle</button></div><div class="settings-row"><div><strong>Yedekten geri yükle</strong><p>Mevcut kayıtlarını seçtiğin dosyayla değiştirir.</p></div><button class="btn secondary sm" data-action="import">${icon('upload',14)} Yükle</button></div>${state.demo?`<div class="settings-row"><div><strong>Örnek verileri temizle</strong><p>Keşif modundan boş uygulamaya dön.</p></div><button class="btn danger sm" data-action="clearDemo">Temizle</button></div>`:''}<div class="info-banner" style="margin-top:22px">${icon('shield',16)} <b>Gerçekten çevrimdışı.</b><p style="margin-top:5px">Harici sunucu, analiz servisi, hesap oluşturma veya internet bağlantısı yoktur. Tarayıcı depolamasını temizlemek verilerini silebilir; düzenli JSON yedeği al.</p></div><p class="fineprint" style="text-align:center;margin-top:18px">GoalWise 2.0 · Yerel uygulama · Türkiye / TRY</p>`)}
function emitTx(goal,type,amount,kind='save',note='',transferId=null,date=new Date().toISOString()){const signed=type==='in'?amount:-amount;goal.saved=round(goal.saved+signed);const t={id:uid(),goalId:goal.id,amount:round(amount),type,kind,note,date,transferId};state.transactions.push(t);return t}
function finishMutation(message,completed=false){persist();close();render();toast(message);if(completed)celebrate()}
function celebrate(){const e=$('confetti');e.innerHTML='';for(let i=0;i<42;i++){const node=document.createElement('i');node.style.left=(Math.random()*100)+'%';node.style.background=COLORS[i%COLORS.length];node.style.animationDelay=(Math.random()*.6)+'s';node.style.setProperty('--dx',Math.floor((Math.random()-.5)*200)+'px');e.appendChild(node)}setTimeout(()=>{e.innerHTML=''},3100)}
function seedDemo(){if(state.goals.length){toast('Örnekleri denemek için boş bir kasa gerekli');return}const now=new Date().toISOString();const data=[{name:'Yeni araba',icon:'🚘',color:COLORS[0],target:780000,date:dayOffset(420),monthlyPlan:33000,letter:'Bu anahtarı eline aldığında tüm küçük birikimlerini hatırla.',amounts:[190000,15000,20000],offsets:[45,22,7]},{name:'Japonya seyahati',icon:'✈️',color:COLORS[1],target:115000,date:dayOffset(240),monthlyPlan:7800,letter:'Tokyo sokaklarından geçmişteki kendine selam!',amounts:[35000,4500,2000,6000],offsets:[28,15,5,2]},{name:'Yeni laptop',icon:'💻',color:COLORS[2],target:86000,date:dayOffset(100),monthlyPlan:4500,letter:'Ürettiklerinle gurur duy!',amounts:[60000,7000,5000],offsets:[40,18,4]}];for(let k=0;k<data.length;k++){const d=data[k],g={id:uid(),name:d.name,icon:d.icon,color:d.color,target:d.target,saved:0,date:d.date,monthlyPlan:d.monthlyPlan,letter:d.letter,createdAt:now};state.goals.push(g);d.amounts.forEach((amount,i)=>{const date=new Date();date.setDate(date.getDate()-d.offsets[i]);emitTx(g,'in',amount,i===0?'opening':k===1&&i===2?'skip':'save',i===0?'Örnek başlangıç birikimi':k===1&&i===2?'Dışarıda yemek yerine birikim':'Örnek birikim',null,date.toISOString())})}state.demo=true;ui.tab='home';persist();render(true);toast('Örnek hedefler eklendi. İstediğinde temizleyebilirsin.')}
function exportFile(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='goalwise-yedek-'+localToday()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Yedek dosyası hazırlandı')}
function txUndo(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;const group=t.transferId?state.transactions.filter(x=>x.transferId===t.transferId):[t];const affected=group.map(x=>({t:x,g:state.goals.find(g=>g.id===x.goalId)}));if(affected.some(x=>!x.g)){toast('Silinmiş hedef içeren aktarım geri alınamaz');return}if(affected.some(({g,t})=>g.saved+(t.type==='in'?-t.amount:t.amount)<-0.001)){toast('Bu işlem geri alınırsa birikim eksiye düşer');return}if(!confirm(group.length>1?'Bu iki taraflı aktarımı geri almak istiyor musun?':'Bu işlemi geri almak istiyor musun?'))return;for(const {g,t} of affected)g.saved=round(g.saved+(t.type==='in'?-t.amount:t.amount));const ids=new Set(group.map(x=>x.id));state.transactions=state.transactions.filter(x=>!ids.has(x.id));persist();render();toast('İşlem geri alındı')}
function clearDemo(){if(!state.demo)return;if(!confirm('Bu ekrandaki tüm hedefler ve işlem kayıtları silinsin mi?'))return;state={version:2,demo:false,goals:[],transactions:[],settings:{privacy:state.settings.privacy}};ui.studioGoal=null;ui.simMonthly=null;ui.tab='home';persist();close();render(true);toast('Örnek veriler temizlendi')}
function deleteGoal(id){const g=state.goals.find(x=>x.id===id);if(!g)return;if(!confirm('“'+g.name+'” hedefini ve bu hedefe ait işlem kayıtlarını kalıcı olarak silmek istiyor musun?'))return;state.goals=state.goals.filter(x=>x.id!==id);state.transactions=state.transactions.filter(t=>t.goalId!==id);if(ui.studioGoal===id){ui.studioGoal=null;ui.simMonthly=null}persist();close();render();toast('Hedef silindi')}
// Delegated interactions remain active after every screen or sheet render.
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-tab]');if(!b)return;const a=b.dataset.action||'tab',id=b.dataset.id;switch(a){case'tab':if(b.dataset.tab){ui.tab=b.dataset.tab;ui.simMonthly=null;ui.simBonus=0;close();render(true)}break;case'newGoal':openGoalForm();break;case'editGoal':openGoalForm(id);break;case'deleteGoal':deleteGoal(id);break;case'detail':openDetail(id);break;case'quickDeposit':openTransaction('in');break;case'deposit':openTransaction('in',id);break;case'withdraw':openTransaction('out',id);break;case'swap':openSwap();break;case'transfer':openTransfer();break;case'settings':openSettings();break;case'privacy':state.settings.privacy=!state.settings.privacy;persist();render();if($('modalRoot').classList.contains('active'))openSettings();break;case'goalFilter':ui.goalFilter=b.dataset.filter;render();break;case'txFilter':ui.txFilter=b.dataset.filter;render();break;case'close':close();break;case'amountChip':$('swapAmount').value=b.dataset.value;updateSwapImpact();break;case'labFor':ui.studioGoal=id;ui.simMonthly=null;ui.simBonus=0;ui.tab='lab';close();render(true);break;case'savePlan':{const g=state.goals.find(x=>x.id===ui.studioGoal);if(!g)break;g.monthlyPlan=round(ui.simMonthly||0);persist();render();toast('Yeni aylık planın kaydedildi');break}case'undoTx':txUndo(id);break;case'demo':seedDemo();break;case'clearDemo':clearDemo();break;case'export':exportFile();break;case'import':$('fileInput').click();break;default:break}});
$('modalRoot').addEventListener('click',e=>{if(e.target===$('modalRoot'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalRoot').classList.contains('active'))close()});
document.addEventListener('input',e=>{if(e.target.id==='monthlyRange'||e.target.id==='bonusInput')updateScenario();if(e.target.id==='swapAmount')updateSwapImpact()});document.addEventListener('change',e=>{if(e.target.id==='labGoal'){ui.studioGoal=e.target.value;ui.simMonthly=null;ui.simBonus=0;render()}if(e.target.id==='swapGoal')updateSwapImpact()});
document.addEventListener('submit',e=>{const form=e.target;if(!['goalForm','transactionForm','swapForm','transferForm'].includes(form.id))return;e.preventDefault();if(form.id==='goalForm'){const id=form.dataset.id,g=state.goals.find(x=>x.id===id),name=$('goalName').value.trim(),target=round(num($('goalTarget').value)),date=$('goalDate').value,plan=round(num($('goalPlan').value)),initial=g?0:round(num($('goalInitial').value)),letter=$('goalLetter').value.trim(),goalIcon=document.querySelector('[name="goalIcon"]:checked')?.value||'🎯';if(!name||!validNum(target)||target<=0||!validNum(plan)||!validNum(initial)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(dayDate(date).valueOf())){toast('Hedef bilgilerini kontrol et');return}if(g){Object.assign(g,{name,target,date,monthlyPlan:plan,letter,icon:goalIcon})}else{const goal={id:uid(),name,target,saved:0,date,monthlyPlan:plan,letter,icon:ICONS.includes(goalIcon)?goalIcon:'🎯',color:COLORS[state.goals.length%COLORS.length],createdAt:new Date().toISOString()};state.goals.unshift(goal);if(initial)emitTx(goal,'in',initial,'opening','Başlangıç birikimi');ui.studioGoal=goal.id;ui.simMonthly=null}finishMutation(g?'Hedefin güncellendi':'Yeni hedefin hazır!');return}if(form.id==='transactionForm'){const g=state.goals.find(g=>g.id===$('txGoal').value),type=form.dataset.type,amount=round(num($('txAmount').value)),note=$('txNote').value.trim();if(!g||amount<=0||!validNum(amount)||!['in','out'].includes(type)){toast('Geçerli tutar gir');return}if(type==='out'&&amount>g.saved){toast('Birikiminden fazla para çekemezsin');return}if(type==='in'&&g.saved+amount>1e12){toast('Çok yüksek tutar');return}const completed=type==='in'&&g.saved<g.target&&g.saved+amount>=g.target;emitTx(g,type,amount,type==='in'?'save':'withdraw',note);finishMutation(completed?'Hedefine ulaştın! Gelecekteki kendin sana teşekkür ediyor 🎉':'İşlem birikimine kaydedildi',completed);return}if(form.id==='swapForm'){const name=$('swapName').value.trim(),g=state.goals.find(g=>g.id===$('swapGoal').value),amount=round(num($('swapAmount').value));if(!name||!g||!validNum(amount)||amount<=0||g.saved+amount>1e12){toast('Bilgileri kontrol et');return}const complete=g.saved<g.target&&g.saved+amount>=g.target;emitTx(g,'in',amount,'skip','Almadım: '+name);finishMutation(complete?'Hayalini tamamladın! 🎉':'Harcamadan birikime dönüştü ✨',complete);return}if(form.id==='transferForm'){const source=state.goals.find(x=>x.id===$('transferFrom').value),dest=state.goals.find(x=>x.id===$('transferTo').value),amount=round(num($('transferAmount').value));if(!source||!dest||source.id===dest.id){toast('İki farklı hedef seç');return}if(!validNum(amount)||amount<=0||source.saved<amount||dest.saved+amount>1e12){toast('Tutar geçersiz veya bakiye yetersiz');return}const transferId=uid(),complete=dest.saved<dest.target&&dest.saved+amount>=dest.target;emitTx(source,'out',amount,'transfer','Aktarım → '+dest.name,transferId);emitTx(dest,'in',amount,'transfer','Aktarım ← '+source.name,transferId);finishMutation(complete?'Aktarım tamamlandı, yeni hedefe ulaştın! 🎉':'Hedeflerin arasında aktarım yapıldı',complete)}});
const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='.json,application/json';fileInput.id='fileInput';fileInput.className='sr-only';document.body.append(fileInput);fileInput.addEventListener('change',async()=>{const file=fileInput.files?.[0];if(!file)return;try{if(file.size>12e6)throw Error('Dosya çok büyük');const parsed=sanitize(JSON.parse(await file.text()));if(!confirm('Mevcut GoalWise verilerin seçtiğin yedekle değiştirilsin mi?'))return;state=parsed;ui.tab='home';ui.studioGoal=null;ui.simMonthly=null;ui.simBonus=0;persist();close();render(true);toast('Yedeğin başarıyla yüklendi')}catch(err){toast('Yedek açılamadı: '+(err.message||'Geçersiz dosya'))}finally{fileInput.value=''}});
render();if(!stored&&typeof localStorage==='undefined')toast('Bu tarayıcıda yerel depolama kullanılamıyor');
})();
